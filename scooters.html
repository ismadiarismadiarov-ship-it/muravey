<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭлМОТО | Скутеры</title>
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/jpeg" href="assets/emoto-logo.jpeg">
    <link rel="apple-touch-icon" href="assets/emoto-logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="section-pages.css">
</head>
<body>
    <header class="shell page-header">
        <div class="head-top">
            <a href="index.html" class="brand">
                <img src="assets/emoto-logo.jpeg" alt="ЭлМОТО">
                <div>
                    <h1><span class="gold">Эл</span><span class="green">МОТО</span></h1>
                    <p>скутеры бөлүмү</p>
                </div>
            </a>
            <div class="head-links">
                <a href="shop.html?panel=orders" class="primary">Заказдар</a>
            </div>
        </div>
        <form id="page-search-form" class="search-box">
            <input id="page-search-input" type="search" placeholder="Скутер товарларын издөө...">
            <button type="submit">Издөө</button>
        </form>
    </header>

    <main class="shell page-main">
        <h2>Скутеры</h2>
        <p>Бул бөлүмдө скутер моделдери жана аксессуарлары көрсөтүлөт.</p>

        <section class="product-grid">
            <article class="product-card" data-name="шаардык скутер">
                <img src="assets/products/rear-stop.jpeg" alt="Шаардык скутер">
                <div class="copy">
                    <h3>Шаардык скутер</h3>
                    <p>74 000 сом</p>
                </div>
            </article>

            <article class="product-card" data-name="электро скутер 48v">
                <img src="assets/products/relay.jpeg" alt="Электро скутер 48V">
                <div class="copy">
                    <h3>Электро скутер 48V</h3>
                    <p>68 500 сом</p>
                </div>
            </article>

            <article class="product-card" data-name="скутер тормоз системасы">
                <img src="assets/products/brake-shoe.jpeg" alt="Скутер тормоз системасы">
                <div class="copy">
                    <h3>Скутер тормоз системасы</h3>
                    <p>3 800 сом</p>
                </div>
            </article>

            <article class="product-card" data-name="скутер осс комплекти">
                <img src="assets/products/front-hub.jpeg" alt="Скутер осс комплекти">
                <div class="copy">
                    <h3>Скутер осс комплекти</h3>
                    <p>5 500 сом</p>
                </div>
            </article>
        </section>
    </main>

    <script src="section-pages.js"></script>
</body>
</html>
