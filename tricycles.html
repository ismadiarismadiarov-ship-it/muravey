<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭлМОТО | Трициклы</title>
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/jpeg" href="assets/emoto-logo.jpeg">
    <link rel="apple-touch-icon" href="assets/emoto-logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="section-pages.css">
</head>
<body>
    <header class="shell page-header">
        <div class="head-top">
            <a href="index.html" class="brand">
                <img src="assets/emoto-logo.jpeg" alt="ЭлМОТО">
                <div>
                    <h1><span class="gold">Эл</span><span class="green">МОТО</span></h1>
                    <p>трициклы бөлүмү</p>
                </div>
            </a>
            <div class="head-links">
                <a href="shop.html?panel=orders" class="primary">Заказдар</a>
            </div>
        </div>
        <form id="page-search-form" class="search-box">
            <input id="page-search-input" type="search" placeholder="Трицикл товарларын издөө...">
            <button type="submit">Издөө</button>
        </form>
    </header>

    <main class="shell page-main">
        <h2>Трициклы</h2>
        <p>Бул бетке трицикл товарларын жүктөй аласыз. Азырынча мисал карточкалар турат.</p>

        <section class="product-grid">
            <article class="product-card" data-name="жүк ташуучу трицикл">
                <img src="assets/products/front-hub.jpeg" alt="Жүк ташуучу трицикл">
                <div class="copy">
                    <h3>Жүк ташуучу трицикл</h3>
                    <p>95 000 сом</p>
                </div>
            </article>

            <article class="product-card" data-name="электро трицикл 60v">
                <img src="assets/products/relay.jpeg" alt="Электро трицикл">
                <div class="copy">
                    <h3>Электро трицикл 60V</h3>
                    <p>112 000 сом</p>
                </div>
            </article>

            <article class="product-card" data-name="шаардык трицикл">
                <img src="assets/products/rear-stop.jpeg" alt="Шаардык трицикл">
                <div class="copy">
                    <h3>Шаардык трицикл</h3>
                    <p>88 500 сом</p>
                </div>
            </article>

            <article class="product-card" data-name="трицикл тормоз комплекти">
                <img src="assets/products/brake-shoe.jpeg" alt="Трицикл тормоз комплекти">
                <div class="copy">
                    <h3>Трицикл тормоз комплекти</h3>
                    <p>4 200 сом</p>
                </div>
            </article>
        </section>
    </main>

    <script src="section-pages.js"></script>
</body>
</html>
